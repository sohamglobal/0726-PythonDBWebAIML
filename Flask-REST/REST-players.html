<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ec; --ink:#1d1a3a; --muted:#6b6785; --card:#ffffff; --line:#e9dfd0;
  --shadow:0 6px 0 rgba(29,26,58,.12);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17142e; --ink:#fff4e3; --muted:#a9a4c9; --card:#241f45; --line:#3a3466; --shadow:0 6px 0 rgba(0,0,0,.35); }
}
*{box-sizing:border-box;margin:0}
body{font-family:'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.4}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:36px 32px;color:#fff;
  background:linear-gradient(120deg,#ff4d6d 0%,#ff9f1c 38%,#2ec4b6 70%,#4361ee 100%);box-shadow:var(--shadow)}
.hero h1{font-size:clamp(2.2rem,6vw,4.2rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.hero p{margin-top:10px;font-size:1.1rem;opacity:.95;max-width:46ch}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}
.stat{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.55);border-radius:18px;padding:10px 18px;min-width:120px}
.stat b{display:block;font-size:2rem;font-weight:800;line-height:1.1}
.stat span{font-size:.9rem}
.ball{position:absolute;right:-30px;top:-30px;font-size:11rem;opacity:.18;transform:rotate(15deg);pointer-events:none}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 14px;align-items:center}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;font:inherit;padding:14px 18px 14px 46px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:#4361ee;box-shadow:0 0 0 4px rgba(67,97,238,.2)}
.search i{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-style:normal}
select,.seg button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
select:focus-visible,button:focus-visible,.card:focus-visible{outline:3px solid #4361ee;outline-offset:2px}
.seg{display:flex}
.seg button{border-radius:0;padding:12px 16px}
.seg button:first-child{border-radius:14px 0 0 14px}
.seg button:last-child{border-radius:0 14px 14px 0;border-left:0}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{font:inherit;font-weight:600;border:2px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;transition:transform .15s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--c);color:#fff}
.count{color:var(--muted);margin:10px 2px 18px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{perspective:900px;height:230px;cursor:pointer;border-radius:22px}
.inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:20px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.front{background:var(--card);border:2px solid var(--line);border-top:10px solid var(--c)}
.back{transform:rotateY(180deg);background:var(--c);color:#fff;justify-content:center;gap:8px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.5rem}
.flag{position:absolute;right:18px;top:20px;font-size:2.4rem}
.name{font-size:1.3rem;font-weight:800;margin-top:auto;letter-spacing:-.01em}
.meta{color:var(--muted);margin-top:2px}
.tag{display:inline-block;margin-top:10px;align-self:flex-start;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font-weight:600;padding:4px 12px;border-radius:999px;font-size:.9rem}
.back h3{font-size:1.5rem;line-height:1.1}
.back .big{font-size:3rem}
.back small{opacity:.9}

/* Table */
.tablewrap{overflow-x:auto;border-radius:18px;border:2px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:14px 18px}
th{cursor:pointer;user-select:none;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--card)}
tr:not(:last-child) td{border-bottom:1px solid var(--line)}
tbody tr:hover{background:color-mix(in srgb,var(--c) 10%,transparent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}

.state{text-align:center;padding:60px 20px;color:var(--muted)}
.state h2{color:var(--ink);margin-bottom:8px}
.state code{background:var(--card);border:1px solid var(--line);padding:2px 8px;border-radius:8px}
.spin{width:44px;height:44px;border:6px solid var(--line);border-top-color:#ff4d6d;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.hero h1{animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="ball" aria-hidden="true">🏆</div>
    <h1>Player Roster</h1>
    <p>Search, filter and flip through every player in your database.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <label class="search"><i>🔍</i><input id="q" type="search" placeholder="Search by name, country or sport" aria-label="Search players"></label>
    <select id="country" aria-label="Filter by country"><option value="">All countries</option></select>
    <select id="sort" aria-label="Sort players">
      <option value="playername">Sort: Name</option>
      <option value="country">Sort: Country</option>
      <option value="sport">Sort: Sport</option>
      <option value="playerid">Sort: ID</option>
    </select>
    <div class="seg" role="group" aria-label="View">
      <button id="vGrid" class="on">Cards</button><button id="vTable">Table</button>
    </div>
  </div>

  <div class="chips" id="chips"></div>
  <div class="count" id="count" aria-live="polite"></div>
  <main id="out"><div class="state"><div class="spin"></div>Loading players…</div></main>
</div>

<script>
const API_URL = 'http://127.0.0.1:5000/players';

const PALETTE = ['#ff4d6d','#4361ee','#2ec4b6','#ff9f1c','#9b5de5','#06a77d','#e63946','#f15bb5','#3a86ff','#fb5607'];
const SPORT_ICON = {cricket:'🏏',football:'⚽',soccer:'⚽',tennis:'🎾',basketball:'🏀',hockey:'🏑',badminton:'🏸',golf:'⛳',baseball:'⚾',rugby:'🏉',boxing:'🥊',swimming:'🏊',athletics:'🏃',cycling:'🚴',chess:'♟️',wrestling:'🤼',kabaddi:'🤼',formula1:'🏎️'};
const ISO = {australia:'AU',india:'IN',england:'GB',"united kingdom":'GB',uk:'GB',scotland:'GB',wales:'GB',usa:'US',"united states":'US',"south africa":'ZA',"new zealand":'NZ',pakistan:'PK',"sri lanka":'LK',bangladesh:'BD',afghanistan:'AF',"west indies":'JM',jamaica:'JM',argentina:'AR',brazil:'BR',portugal:'PT',france:'FR',germany:'DE',spain:'ES',italy:'IT',netherlands:'NL',belgium:'BE',croatia:'HR',serbia:'RS',switzerland:'CH',canada:'CA',china:'CN',japan:'JP',"south korea":'KR',russia:'RU',norway:'NO',sweden:'SE',poland:'PL',ireland:'IE',zimbabwe:'ZW',kenya:'KE',nigeria:'NG',egypt:'EG',mexico:'MX',uruguay:'UY',colombia:'CO',belarus:'BY',greece:'GR',denmark:'DK',turkey:'TR',ukraine:'UA'};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = {all:[], sport:'', view:'grid', colors:{}, sortDir:1};

const flag = c => { const k = ISO[String(c||'').toLowerCase()]; return k ? String.fromCodePoint(...[...k].map(ch => 127397 + ch.charCodeAt(0))) : '🌍'; };
const icon = s => SPORT_ICON[String(s||'').toLowerCase().replace(/\s/g,'')] || '🏅';
const initials = n => String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');

async function load(){
  try{
    const r = await fetch(API_URL);
    if(!r.ok) throw new Error('Server answered with status ' + r.status);
    const data = await r.json();
    if(!Array.isArray(data)) throw new Error('Expected a list of players');
    state.all = data;
    [...new Set(data.map(p=>p.sport))].sort().forEach((s,i)=> state.colors[s] = PALETTE[i % PALETTE.length]);
    buildControls(); render();
  }catch(e){
    $('out').innerHTML = `<div class="state"><h2>Couldn’t load players</h2>
      <p>${esc(e.message)}. Check that your Flask server is running at <code>${esc(API_URL)}</code>.</p>
      <p style="margin-top:10px">If the browser console mentions CORS, add <code>flask-cors</code> to your API.</p></div>`;
    $('count').textContent = '';
  }
}

function buildControls(){
  const countries = [...new Set(state.all.map(p=>p.country))].sort();
  $('country').innerHTML = '<option value="">All countries</option>' + countries.map(c=>`<option value="${esc(c)}">${flag(c)} ${esc(c)}</option>`).join('');
  const sports = Object.keys(state.colors);
  $('chips').innerHTML = `<button class="chip on" style="--c:#1d1a3a" data-s="">All sports</button>` +
    sports.map(s=>`<button class="chip" style="--c:${state.colors[s]}" data-s="${esc(s)}">${icon(s)} ${esc(s)}</button>`).join('');
  const n = state.all.length;
  $('stats').innerHTML = [[n,'players'],[countries.length,'countries'],[sports.length,'sports']]
    .map(([v,l],i)=>`<div class="stat"><b data-to="${v}">0</b><span>${l}</span></div>`).join('');
  document.querySelectorAll('[data-to]').forEach(el=>{
    const to = +el.dataset.to, t0 = performance.now();
    (function tick(t){ const p = Math.min((t-t0)/900,1); el.textContent = Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(tick); })(t0);
  });
}

function filtered(){
  const q = $('q').value.trim().toLowerCase(), c = $('country').value, k = $('sort').value;
  return state.all.filter(p =>
      (!state.sport || p.sport === state.sport) && (!c || p.country === c) &&
      (!q || [p.playername,p.country,p.sport].some(v => String(v).toLowerCase().includes(q))))
    .sort((a,b)=> state.sortDir * (k==='playerid' ? a[k]-b[k] : String(a[k]).localeCompare(String(b[k]))));
}

function render(){
  const list = filtered();
  $('count').textContent = `Showing ${list.length} of ${state.all.length} players`;
  if(!list.length){ $('out').innerHTML = '<div class="state"><h2>No players match</h2><p>Clear the search or pick a different sport or country.</p></div>'; return; }
  $('out').innerHTML = state.view === 'grid' ? gridHTML(list) : tableHTML(list);
}

const gridHTML = list => `<div class="grid">` + list.map(p=>`
  <div class="card" tabindex="0" role="button" aria-label="${esc(p.playername)}, tap to flip" style="--c:${state.colors[p.sport]}">
    <div class="inner">
      <div class="face front">
        <div class="avatar">${esc(initials(p.playername))}</div><div class="flag">${flag(p.country)}</div>
        <div class="name">${esc(p.playername)}</div>
        <div class="meta">${esc(p.country)}</div>
        <span class="tag">${icon(p.sport)} ${esc(p.sport)}</span>
      </div>
      <div class="face back">
        <div class="big">${icon(p.sport)}</div>
        <h3>${esc(p.playername)}</h3>
        <div>${flag(p.country)} Plays ${esc(p.sport)} for ${esc(p.country)}</div>
        <small>Player ID #${esc(p.playerid)}</small>
      </div>
    </div>
  </div>`).join('') + `</div>`;

const tableHTML = list => `<div class="tablewrap"><table><thead><tr>
  ${[['playerid','ID'],['playername','Player'],['country','Country'],['sport','Sport']].map(([k,l])=>`<th data-k="${k}">${l} ${$('sort').value===k?(state.sortDir>0?'▲':'▼'):''}</th>`).join('')}
  </tr></thead><tbody>` + list.map(p=>`<tr style="--c:${state.colors[p.sport]}">
    <td>${esc(p.playerid)}</td><td><b>${esc(p.playername)}</b></td><td>${flag(p.country)} ${esc(p.country)}</td>
    <td><span class="dot"></span>${icon(p.sport)} ${esc(p.sport)}</td></tr>`).join('') + `</tbody></table></div>`;

// Events
$('q').addEventListener('input', render);
$('country').addEventListener('change', render);
$('sort').addEventListener('change', ()=>{ state.sortDir = 1; render(); });
$('chips').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  state.sport = b.dataset.s;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x===b));
  render();
});
function setView(v){ state.view = v; $('vGrid').classList.toggle('on', v==='grid'); $('vTable').classList.toggle('on', v==='table'); render(); }
$('vGrid').onclick = ()=>setView('grid'); $('vTable').onclick = ()=>setView('table');
$('out').addEventListener('click', e=>{
  const card = e.target.closest('.card'); if(card) return card.classList.toggle('flip');
  const th = e.target.closest('th'); if(th){
    if($('sort').value === th.dataset.k) state.sortDir *= -1; else { $('sort').value = th.dataset.k; state.sortDir = 1; }
    render();
  }
});
$('out').addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('card')){ e.preventDefault(); e.target.classList.toggle('flip'); }
});

load();
</script>
</body>
</html>
